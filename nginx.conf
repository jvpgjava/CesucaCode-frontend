server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Materiais enviados (volume de media do backend, montado só leitura).
    # Nomes com UUID; sempre como download, nunca renderizados no domínio.
    location /media/ {
        alias /media/;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "private, no-store";
    }

    # SPA: rotas do React Router caem no index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
